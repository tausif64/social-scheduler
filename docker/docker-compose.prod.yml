# Save as: docker/docker-compose.prod.yml
# PRODUCTION ONLY — the full containerized stack, run on the VPS.
# This is a standalone file (not layered on top of docker-compose.yml) —
# it defines its own postgres/redis so it can run by itself on a fresh VPS.
#
# Usage: docker compose -f docker/docker-compose.prod.yml --env-file .env up -d --build

services:
  postgres:
    image: postgres:16-alpine
    environment:
      TZ: UTC
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: social_scheduler
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    # No `ports:` to the host here — only containers on this Compose
    # network need to reach Postgres, the outside world never should.

  redis:
    image: redis:7-alpine
    environment:
      TZ: UTC
    restart: unless-stopped
    # Same reasoning — no host port mapping.

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      TZ: UTC
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    # No `ports:` — nginx is the only thing that talks to api from outside.

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    environment:
      TZ: UTC
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    # No `ports:` at all — worker has nothing to expose.

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      TZ: UTC
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      - api
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  postgres_data: