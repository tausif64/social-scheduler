# Save as: docker/docker-compose.yml
# Run from repo root: docker compose -f docker/docker-compose.yml --env-file .env up -d

services:
  postgres:
    image: postgres:17-alpine
    environment:
      TZ: UTC
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: social_scheduler
    ports:
      - "5432:5432" # exposed to host — your native api/worker connect via localhost
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs once, only on first boot with an empty volume — creates the
      # second logical `openfga` database that openfga-migrate needs below,
      # since POSTGRES_DB above only auto-creates `social_scheduler`.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d social_scheduler"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    environment:
      TZ: UTC
    ports:
      - "6379:6379"
    restart: unless-stopped

  openfga-migrate:
    image: openfga/openfga:latest
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/openfga?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  openfga:
    image: openfga/openfga:latest
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/openfga?sslmode=disable
      OPENFGA_PLAYGROUND_ENABLED: "true"
      OPENFGA_PLAYGROUND_ADDR: "0.0.0.0:3000"
    ports:
      - "8080:8080" # HTTP API — your native api/worker call this via localhost
      - "8081:8081" # gRPC
      - "3001:3000" # Playground → http://localhost:3001/playground
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

